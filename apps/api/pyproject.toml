[project]
name = "f1intelligence-api"
version = "0.1.0"
description = "F1 Intelligence API and research services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "redis>=6,<7",
  "orjson>=3.10,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
